name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The id-token permission lets GitHub mint the short-lived OIDC token that Google exchanges for credentials.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sixth-guess \
            --source . \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --port 8080 \
            --memory 512Mi \
            --max-instances 3 \
            --set-secrets CHALLENGE_KEY=challenge-key:latest \
            --quiet
      - name: Send all traffic to the new revision
        # A manual deploy with --no-traffic pins traffic to an older revision; this keeps every push live.
        run: |
          gcloud run services update-traffic sixth-guess \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --to-latest \
            --quiet
      - name: Smoke test
        run: |
          url=$(gcloud run services describe sixth-guess --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl --fail --silent --show-error "$url/" | grep -q '<title>Palabrita</title>'
          curl --fail --silent --show-error -o /dev/null "$url/manifest.webmanifest"
          echo "Live at $url"
