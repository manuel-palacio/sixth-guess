<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Guess the five-letter word in six tries, with a scratchpad that does the pen-and-paper work." />
    <meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a33" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sixth Guess</title>
  </head>
  <body>
    <header class="topbar">
      <h1 class="wordmark">
        <span class="wordmark-glyph" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="wordmark-text">Sixth Guess</span>
      </h1>
      <div class="mode-switch" role="radiogroup" aria-label="Game mode" data-i18n-aria="modeGroup">
        <button type="button" role="radio" data-mode="daily" aria-checked="true" data-i18n="modeDaily">Daily</button>
        <button type="button" role="radio" data-mode="practice" aria-checked="false" data-i18n="modePractice">Practice</button>
      </div>
      <label class="language-picker">
        <span class="visually-hidden" data-i18n="wordLanguage">Language</span>
        <select id="language"></select>
      </label>
      <button type="button" class="icon-button" id="open-stats" aria-label="Statistics" data-i18n-aria="statistics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6" /></svg>
      </button>
      <button type="button" class="icon-button" id="open-challenge" aria-label="Challenge a friend" data-i18n-aria="challengeTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5 21 3z" /></svg>
      </button>
      <button type="button" class="icon-button" id="open-settings" aria-label="Settings" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>
      </button>
    </header>

    <main class="layout">
      <section class="board-area" aria-label="Game board" data-i18n-aria="gameBoard">
        <p class="game-caption" id="game-caption"></p>
        <p class="challenge-clue" id="challenge-clue" hidden></p>
        <div class="board" id="board"></div>
        <div class="toast" id="toast" role="alert" aria-live="assertive"></div>
      </section>

      <aside class="scratchpad" id="scratchpad">
        <details id="scratchpad-details">
          <summary>
            <span class="pad-title" data-i18n="scratchpad">Scratchpad</span>
            <span class="pad-summary" id="pad-summary"></span>
          </summary>
          <div class="pad-body">
            <section class="pad-section">
              <h2 data-i18n="pattern">Pattern</h2>
              <div class="pattern" id="pattern"></div>
            </section>
            <section class="pad-section">
              <h2 data-i18n="lettersLeft">Letters left</h2>
              <p class="pool" id="pool"></p>
            </section>
            <section class="pad-section">
              <p class="pad-note" id="off-dictionary" data-i18n="offDictionary" hidden></p>
              <p class="fit-count" id="fit-count"></p>
              <div class="pad-actions">
                <button type="button" class="pad-button" id="toggle-words" aria-expanded="false" aria-controls="fit-words">Show words that fit</button>
                <button type="button" class="pad-button" id="suggest" data-i18n="suggest">Suggest a guess</button>
              </div>
              <p class="suggestion" id="suggestion" aria-live="polite"></p>
              <ol class="fit-words" id="fit-words" hidden></ol>
            </section>
          </div>
        </details>
      </aside>

      <div class="keyboard" id="keyboard" role="group" aria-label="Keyboard" data-i18n-aria="keyboard"></div>
    </main>

    <p class="visually-hidden" id="announcer" aria-live="polite"></p>

    <dialog class="sheet" id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="sheet-head">
        <h2 id="settings-title" data-i18n="settings">Settings</h2>
        <button class="icon-button" aria-label="Close" data-i18n-aria="close">✕</button>
      </form>
      <div class="sheet-body">
        <label class="setting">
          <span><strong data-i18n="hardMode">Hard mode</strong><small data-i18n="hardModeHelp"></small></span>
          <input type="checkbox" id="setting-hard" />
        </label>
        <p class="form-status" id="settings-status" role="status" data-dialog-status></p>
        <label class="setting">
          <span><strong data-i18n="scratchpad">Scratchpad</strong><small data-i18n="scratchpadHelp"></small></span>
          <input type="checkbox" id="setting-scratchpad" />
        </label>
        <label class="setting">
          <span><strong data-i18n="colourBlind">Colour-blind mode</strong><small data-i18n="colourBlindHelp"></small></span>
          <input type="checkbox" id="setting-contrast" />
        </label>
        <div class="setting-stack">
          <strong id="palette-label" data-i18n="theme">Theme</strong>
          <fieldset class="palette-picker" id="palette-picker" aria-labelledby="palette-label">
            <label class="palette-option">
              <input type="radio" name="palette" value="notebook" />
              <span class="palette-swatch" data-palette="notebook" aria-hidden="true"><i></i><i></i><i></i></span>
              <span data-i18n="paletteNotebook"></span>
            </label>
            <label class="palette-option">
              <input type="radio" name="palette" value="sage" />
              <span class="palette-swatch" data-palette="sage" aria-hidden="true"><i></i><i></i><i></i></span>
              <span data-i18n="paletteSage"></span>
            </label>
            <label class="palette-option">
              <input type="radio" name="palette" value="lavender" />
              <span class="palette-swatch" data-palette="lavender" aria-hidden="true"><i></i><i></i><i></i></span>
              <span data-i18n="paletteLavender"></span>
            </label>
          </fieldset>
        </div>
        <label class="setting">
          <span><strong data-i18n="appearance">Appearance</strong></span>
          <select id="setting-theme">
            <option value="system" data-i18n="themeSystem">Match system</option>
            <option value="light" data-i18n="themeLight">Light</option>
            <option value="dark" data-i18n="themeDark">Dark</option>
          </select>
        </label>
        <section class="how-to">
          <h3 data-i18n="howToPlay">How to play</h3>
          <p data-i18n="howIntro"></p>
          <ul>
            <li><span class="mini-tile" data-state="correct">C</span> <span data-i18n="howCorrect"></span></li>
            <li><span class="mini-tile" data-state="present">A</span> <span data-i18n="howPresent"></span></li>
            <li><span class="mini-tile" data-state="absent">T</span> <span data-i18n="howAbsent"></span></li>
          </ul>
          <p data-i18n="howModes"></p>
        </section>
      </div>
    </dialog>

    <dialog class="sheet welcome" id="welcome-dialog" aria-labelledby="welcome-title" aria-describedby="welcome-intro">
      <form method="dialog" class="sheet-body welcome-body">
        <div class="welcome-glyph" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <h2 id="welcome-title"></h2>
        <p id="welcome-intro" data-i18n="welcomeIntro"></p>
        <p class="welcome-clue" id="welcome-clue" hidden></p>
        <ul class="welcome-key">
          <li><span class="mini-tile" data-state="correct">C</span> <span data-i18n="howCorrect"></span></li>
          <li><span class="mini-tile" data-state="present">A</span> <span data-i18n="howPresent"></span></li>
          <li><span class="mini-tile" data-state="absent">T</span> <span data-i18n="howAbsent"></span></li>
        </ul>
        <p class="welcome-note" id="welcome-any-letters" data-i18n="welcomeAnyLetters" hidden></p>
        <button class="primary-button welcome-start" id="welcome-start" data-i18n="welcomeStart" autofocus></button>
      </form>
    </dialog>

    <dialog class="sheet" id="challenge-dialog" aria-labelledby="challenge-title">
      <form method="dialog" class="sheet-head">
        <h2 id="challenge-title" data-i18n="challengeTitle">Challenge a friend</h2>
        <button class="icon-button" aria-label="Close" data-i18n-aria="close">✕</button>
      </form>
      <div class="sheet-body challenge-maker">
        <p class="hint" data-i18n="challengeHelp"></p>
        <form id="challenge-form" class="challenge-form" novalidate>
          <label>
            <span data-i18n="challengeWord"></span>
            <input id="challenge-word" name="word" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" required />
          </label>
          <label>
            <span data-i18n="challengeClue"></span>
            <input id="challenge-clue-input" name="clue" maxlength="80" autocomplete="off" />
          </label>
          <label>
            <span data-i18n="challengeFrom"></span>
            <input id="challenge-from" name="from" maxlength="30" autocomplete="given-name" />
          </label>
          <button type="submit" class="primary-button" data-i18n="challengeCreate"></button>
        </form>
        <p class="form-status" id="challenge-status" role="status" data-dialog-status></p>
        <input class="challenge-link" id="challenge-link" readonly hidden aria-label="Link" />
      </div>
    </dialog>

    <dialog class="sheet" id="stats-dialog" aria-labelledby="stats-title">
      <form method="dialog" class="sheet-head">
        <h2 id="stats-title" data-i18n="statistics">Statistics</h2>
        <button class="icon-button" aria-label="Close" data-i18n-aria="close">✕</button>
      </form>
      <div class="sheet-body" id="stats-body"></div>
    </dialog>

    <dialog class="sheet" id="result-dialog" aria-labelledby="result-title">
      <form method="dialog" class="sheet-head">
        <h2 id="result-title"></h2>
        <button class="icon-button" aria-label="Close" data-i18n-aria="close">✕</button>
      </form>
      <div class="sheet-body">
        <p class="result-answer" id="result-answer"></p>
        <div class="result-actions">
          <button type="button" class="primary-button" id="share" data-i18n="share">Share result</button>
          <button type="button" class="secondary-button" id="next-game">Play another</button>
        </div>
        <p class="form-status" id="result-status" role="status" data-dialog-status></p>
        <p class="next-daily" id="next-daily"></p>
        <p class="strategy-score" id="strategy-score"></p>
        <button type="button" class="link-button" id="challenge-this-word" data-i18n="challengeThisWord"></button>
        <section>
          <h3 data-i18n="reviewTitle">Your game, guess by guess</h3>
          <div id="review"></div>
        </section>
        <section id="result-stats"></section>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
